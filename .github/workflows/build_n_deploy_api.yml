name: api

on:
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/build_n_deploy_api.yml"]
  pull_request:
    paths: ["api/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: seminar-contacts
    # Aquí sí mantenemos env para no repetir la construcción del string 3 veces
    env:
      IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME || 'local' }}/seminar-api:${{ github.sha }}
      PUBLISH: ${{ vars.DOCKERHUB_USERNAME != '' }}
    outputs:
      image_tag: ${{ env.IMAGE }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build (and push)
        uses: docker/build-push-action@v7
        with:
          context: ./api
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.IMAGE }}
          build-args: VERSION=${{ github.sha }}

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && vars.DOCKERHUB_USERNAME != '' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment: seminar-contacts
    steps:
      - name: Check the settings
        run: |
          missing=0
          check_var() {
            if [ -z "$2" ]; then
              echo "::error::Variable $1 is not set (Settings → Secrets and variables → Actions → Variables)"
              missing=1
            fi
          }
          # Inyectamos el contexto de GitHub directamente en la función bash
          check_var "AZURE_TENANT_ID" "${{ vars.AZURE_TENANT_ID }}"
          check_var "AZURE_SUBSCRIPTION_ID" "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          check_var "AZURE_RESOURCE_GROUP" "${{ vars.AZURE_RESOURCE_GROUP }}"
          check_var "CONTAINER_APP_NAME" "${{ vars.CONTAINER_APP_NAME }}"
          exit $missing
      - name: Log in to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy the new image to the Container App
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ needs.build.outputs.image_tag }}" \
            --set-env-vars DB_CONTACT_SERVICE_HOST="${{ vars.DB_CONTACT_SERVICE_HOST }}" \
                           DB_CONTACT_SERVICE_PORT="${{ vars.DB_CONTACT_SERVICE_PORT || '5432' }}" \
                           DB_CONTACT_SERVICE_NAME="${{ vars.DB_CONTACT_SERVICE_NAME }}" \
                           DB_CONTACT_SERVICE_USER="${{ vars.DB_CONTACT_SERVICE_USER }}" \
                           DB_CONTACT_SERVICE_PASSWORD="${{ secrets.DB_CONTACT_SERVICE_PASSWORD }}"
services:
  postgres:
    image: postgres:16-alpine
    container_name: contact-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: contacts_db
      POSTGRES_USER: contacts_user
      POSTGRES_PASSWORD: contacts_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contacts_user -d contacts_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  spring-boot:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: contact-api
    ports:
      - "8081:8080"
    environment:
      DB_CONTACT_SERVICE_HOST: postgres
      DB_CONTACT_SERVICE_PORT: 5432
      DB_CONTACT_SERVICE_NAME: contacts_db
      DB_CONTACT_SERVICE_USER: contacts_user
      DB_CONTACT_SERVICE_PASSWORD: contacts_pass
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
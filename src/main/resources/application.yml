spring:
  datasource:
    url: jdbc:postgresql://${DB_CONTACT_SERVICE_HOST:localhost}:${DB_CONTACT_SERVICE_PORT:5432}/${DB_CONTACT_SERVICE_NAME:contacts_db}
    username: ${DB_CONTACT_SERVICE_USER}
    password: ${DB_CONTACT_SERVICE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:flyway/releases, classpath:flyway/repeatables

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    org.flywaydb: DEBUG